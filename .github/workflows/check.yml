name: literature-tools-check

on:
  push:
    paths:
      - "python/**"
      - "R/**"
      - "data/example.bib"
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m py_compile python/*.py
      - run: python python/doi_normalize.py data/example.bib
